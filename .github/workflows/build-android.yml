name: Build Android APK

on:
workflow_dispatch:
push:
branches:
- main

jobs:
build:
runs-on: ubuntu-latest

steps:
  - name: Checkout code
    uses: actions/checkout@v4

  - name: Setup Node.js
    uses: actions/setup-node@v4
    with:
      node-version: 20

  - name: Install dependencies
    run: npm install

  - name: Build web app
    run: npm run build

  - name: Upload web build
    uses: actions/upload-artifact@v4
    with:
      name: rawan-ai-web-build
      path: dist/
