[build]
  command = "npm run build"
  publish = "dist"
  functions = "netlify/functions"

# Route API calls to Netlify serverless functions
[[redirects]]
  from = "/api/chat-audio"
  to = "/.netlify/functions/chat-audio"
  status = 200

[[redirects]]
  from = "/api/tts"
  to = "/.netlify/functions/tts"
  status = 200

[[redirects]]
  from = "/api/health"
  to = "/.netlify/functions/health"
  status = 200

# Single Page App routing fallback
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

[build.environment]
  NODE_VERSION = "22"
